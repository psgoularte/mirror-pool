[package]
name = "mirror-pool-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "mirror-pool developer CLI: setup, keygen, deposit, prove, execute, disclose, sim."

[[bin]]
name = "mirror-pool"
path = "src/main.rs"

[dependencies]
mirror-pool-common = { workspace = true, features = ["crypto"] }
mirror-pool-circuit.workspace = true
mirror-pool-anonymity = { path = "../anonymity" }
# Reused for RelayJob + the on-chain submit path (pulls solana-client 2.3).
mirror-pool-relayer = { path = "../relayer" }
mirror-pool-program = { path = "../program", features = ["no-entrypoint"] }
ark-bn254 = { workspace = true, features = ["std"] }
ark-ff.workspace = true
ark-std = { workspace = true, features = ["std"] }
ark-serialize.workspace = true
solana-client = "2.3"
solana-sdk = "2.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rand = "0.8"
hex = "0.4"
