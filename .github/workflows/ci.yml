name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Fast, host-only gates: formatting, lints, and the full test suite
  # (circuit unit tests, program logic tests, the Poseidon equality test, and
  # the compute-unit benchmark). These run on the stable toolchain pinned by
  # rust-toolchain.toml.
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: test
        run: cargo test --workspace --all-features

  # The on-chain program must compile to SBF bytecode. This gate catches
  # BPF-only breakage (host-forbidden syscalls, oversized stack frames) that
  # the host build above cannot.
  build-sbf:
    name: build-sbf (program)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-sbf-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-sbf-

      - name: Install Solana (Agave) toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: cargo build-sbf
        run: cargo build-sbf --manifest-path program/Cargo.toml

      # Prove a real arkworks proof verifies on-chain, under the CU budget.
      # The bench crate is workspace-excluded (own Solana version), so it runs
      # via its own manifest.
      - name: generate CU benchmark fixture
        run: cargo test -p mirror-pool-program --test gen_fixture -- --ignored --nocapture

      - name: compute-unit benchmark (verification < 200k CU)
        run: cargo run --release --manifest-path bench/Cargo.toml --bin cu-bench

      - name: end-to-end init + deposit (on-chain root == reference)
        run: cargo run --release --manifest-path bench/Cargo.toml --bin e2e

      - name: full flow (prove → execute_action → nullifier/replay/negatives)
        run: cargo run --release --manifest-path bench/Cargo.toml --bin flow

      - name: compliance (screening hook + selective disclosure)
        run: cargo run --release --manifest-path bench/Cargo.toml --bin compliance

      - name: privacy trace red-team (fee payer, anonymity set, no linkage)
        run: cargo run --release --manifest-path bench/Cargo.toml --bin trace
