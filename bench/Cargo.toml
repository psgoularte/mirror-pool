[package]
name = "mirror-pool-cu-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Compute-unit benchmark for mirror-pool on-chain membership verification."

# Deliberately NOT a workspace member (see the root Cargo.toml `exclude`): this
# crate runs litesvm, which tracks the latest Solana release, and must resolve
# its Solana dependencies independently of the program's solana-program 2.3.

[[bin]]
name = "cu-bench"
path = "src/main.rs"

[[bin]]
name = "e2e"
path = "src/e2e.rs"

[dependencies]
litesvm = "0.14"
# Reference tree/hashing to check the deployed program's root. Pulls arkworks
# (no Solana deps), so it does not disturb litesvm's Solana graph.
mirror-pool-common = { path = "../common" }
solana-address = ">=2.2, <3"
solana-account = "4"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
solana-transaction = "4"
solana-compute-budget-interface = "3"
