[package]
name = "mirror-pool-program"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "mirror-pool on-chain program: Merkle tree, nullifiers, epochs, PDA execution, compliance."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program.workspace = true
groth16-solana.workspace = true
thiserror.workspace = true
borsh = { version = "1", features = ["derive"] }
# Zero-copy for the large PoolConfig account: the struct is cast directly out of
# the account buffer, so it never lands on the (4 KB) BPF stack.
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
# On-chain Poseidon: the `sol_poseidon` syscall on BPF (light-poseidon only on
# the host), so no heavy param builder reaches the BPF binary.
solana-poseidon = "2.2"
# Pure protocol constants only (TREE_DEPTH, ROOT_HISTORY_SIZE) — `crypto`
# feature off (workspace default), so arkworks/light-poseidon are NOT compiled
# into the program's BPF binary.
mirror-pool-common = { workspace = true }

[features]
# Downstream crates (relayer, CLI, integration tests) link the program as a
# library for its instruction/state types without pulling in the BPF
# entrypoint symbol.
no-entrypoint = []
# Referenced by `solana_program::entrypoint!`; declaring them keeps the SBF
# build free of `unexpected_cfgs` warnings under CI's `-D warnings`.
custom-heap = []
custom-panic = []

[lints.rust]
# `target_os = "solana"` is only defined by the SBF target; teach the host
# build's lint pass that it is a valid value rather than a typo.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
# Real VK/proof fixtures come from the circuit crate. The litesvm-based
# compute-unit benchmark lives in the workspace-excluded `bench/` crate, which
# keeps its own (newer) Solana dependency graph so it never has to unify with
# this crate's solana-program 2.3 — they interact only via the compiled `.so`
# and a fixture file.
mirror-pool-circuit.workspace = true
mirror-pool-common = { workspace = true, features = ["crypto"] }
ark-std = { workspace = true, features = ["std"] }
